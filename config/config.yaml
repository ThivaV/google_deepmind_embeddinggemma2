# ---------------------------------------------------------------------------
# {{PROJECT_TITLE}} -- pipeline configuration
#
# This file holds the *stable* wiring of the pipeline: where every stage reads
# from and where it writes to. Anything you would tune between experiments
# (split ratios, hyperparameters, thresholds) belongs in params.yaml instead.
#
# Nothing reads these keys directly. They are loaded once by
# {{PACKAGE_NAME}}.config.configuration.ConfigurationManager, which hands each
# stage a frozen dataclass from {{PACKAGE_NAME}}.entity. Key names therefore
# match the entity field names one-for-one -- rename one and you must rename the
# other.
#
# Every relative path is resolved against the repository root, so the pipeline
# behaves the same from `python main.py`, from `dvc repro`, and from a notebook.
# ---------------------------------------------------------------------------

project_name: "{{PROJECT_NAME}}"

# --- roots -----------------------------------------------------------------
# artifacts_root  intermediate, reproducible stage output (safe to delete)
# data_root       datasets, in three medallion layers:
#                   .data/bronze  raw, exactly as ingested
#                   .data/silver  validated and cleaned
#                   .data/gold    model-ready (train/test splits)
# models_root     the trained model that gets shipped / served by app.py
artifacts_root: artifacts
data_root: .data
models_root: .models

# ---------------------------------------------------------------------------
# Stage 1 -- data_ingestion
#
# Downloads `source_url` to `local_data_file`; if that file is an archive it is
# unpacked into `unzip_dir`. Both land in the bronze layer exactly as received.
# Leave `source_url` empty to drop the dataset in by hand instead -- the stage
# then just checks that `local_data_file` is there.
# ---------------------------------------------------------------------------
data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: "https://archive.ics.uci.edu/static/public/186/wine+quality.zip"
  local_data_file: .data/bronze/wine-quality.zip
  unzip_dir: .data/bronze/extracted

# ---------------------------------------------------------------------------
# Stage 2 -- data_validation
#
# Checks the bronze file against `schema` before anything downstream is
# allowed to touch it, then writes the cleaned dataset (normalised column
# names, comma separated) to `validated_data_file` in the silver layer. How
# strict the checks are is set in params.yaml -> data_validation.
# ---------------------------------------------------------------------------
data_validation:
  root_dir: artifacts/data_validation
  # The member of `data_ingestion.unzip_dir` that this project actually uses.
  input_data_file: .data/bronze/extracted/winequality-red.csv
  input_separator: ";"
  validated_data_file: .data/silver/dataset.csv
  report_file: artifacts/data_validation/report.json
  status_file: artifacts/data_validation/status.json
  # Expected columns and dtypes, after column names are lower-cased and
  # snake-cased. Columns not listed here are dropped.
  schema:
    fixed_acidity: float
    volatile_acidity: float
    citric_acid: float
    residual_sugar: float
    chlorides: float
    free_sulfur_dioxide: float
    total_sulfur_dioxide: float
    density: float
    ph: float
    sulphates: float
    alcohol: float
    quality: int

# ---------------------------------------------------------------------------
# Stage 3 -- data_transformation
#
# Splits the silver dataset into the gold layer's train and test files, and
# fits the preprocessing pipeline on the train split only, so the test split
# stays honest. The fitted preprocessor goes to artifacts/ and is reused by
# the training and evaluation stages.
# ---------------------------------------------------------------------------
data_transformation:
  root_dir: artifacts/data_transformation
  input_data_file: .data/silver/dataset.csv
  train_data_file: .data/gold/train.csv
  test_data_file: .data/gold/test.csv
  preprocessor_file: artifacts/data_transformation/preprocessor.joblib
  summary_file: artifacts/data_transformation/summary.json

# ---------------------------------------------------------------------------
# Stage 4 -- model_trainer
#
# Trains the estimator selected in params.yaml -> model_trainer.model_type and
# writes it to `model_path`, which is what app.py loads.
# ---------------------------------------------------------------------------
model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: .data/gold/train.csv
  test_data_path: .data/gold/test.csv
  preprocessor_path: artifacts/data_transformation/preprocessor.joblib
  model_path: .models/model.joblib
  # Leave null to use params.yaml -> target_column (the DVC-tracked default).
  # Set a column name here only to pin the target for this project regardless
  # of the experiment parameters.
  target_column: null
  feature_importance_file: artifacts/model_trainer/feature_importance.csv
  training_summary_file: artifacts/model_trainer/training_summary.json

# ---------------------------------------------------------------------------
# Stage 5 -- model_evaluation
#
# Scores the trained model on the held-out split. `metrics_file` is the file
# DVC reads for `dvc metrics show` / `dvc metrics diff`.
# ---------------------------------------------------------------------------
model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: .data/gold/test.csv
  preprocessor_path: artifacts/data_transformation/preprocessor.joblib
  model_path: .models/model.joblib
  metrics_file: artifacts/model_evaluation/metrics.json
  report_file: artifacts/model_evaluation/classification_report.json
  predictions_file: artifacts/model_evaluation/predictions.csv
