name: CI

# Lint and test on every push and pull request against main.
#
# This workflow ships inside a GitHub template repository, so it has to stay
# green in two very different states:
#
#   * The bare template, where the placeholders are still unsubstituted and the
#     package directory is the sentinel src/project_name/. An import written
#     against a placeholder package name is not valid Python, so ruff and pytest
#     are deferred and the static scaffolding is checked instead.
#   * A generated repository, after bootstrap.py has substituted the placeholders
#     and renamed the package. There, ruff and pytest are real blocking checks.
#
# A generated repository that has no tests written yet also stays green: the
# pytest exit code for "nothing was collected" (5) is treated as a pass.

# main is the expected default branch; master is listed alongside it so the
# workflow still runs in a repository whose default branch is named master,
# exactly like .github/workflows/bootstrap.yml does.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for requirements in requirements.txt requirements-dev.txt; do
            if [ -f "$requirements" ]; then
              echo "Installing $requirements"
              pip install -r "$requirements"
            else
              echo "$requirements is not present -- skipping it."
            fi
          done
          # The steps below need these tools even if the requirements files have
          # been trimmed down, so make sure they are always available. PyYAML is
          # here because the template scaffolding check parses the YAML configs.
          pip install ruff pytest pytest-cov PyYAML

      - name: Detect an un-bootstrapped template
        id: template
        run: |
          # bootstrap.py renames src/project_name/ to the real package and rewrites
          # every placeholder in the tree. Both still being in place means it has not
          # run yet. "project_name" below is the on-disk sentinel directory name,
          # not a placeholder: it is meant to stay literal in this file.
          if [ -d src/project_name ] && grep -qE '\{\{[A-Z_]+\}\}' setup.py; then
            echo "bare=true" >> "$GITHUB_OUTPUT"
            echo "This is the bare template: deferring ruff and pytest."
          else
            echo "bare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the template scaffolding
        if: steps.template.outputs.bare == 'true'
        run: |
          # In the template repository itself the placeholders are supposed to be
          # here, so this is only worth a quiet notice. In a GENERATED repository it
          # means bootstrapping did not happen, which is silent breakage the user
          # would otherwise only notice by spotting src/project_name themselves --
          # so shout about it, and say exactly how to fix it.
          if [ "${{ github.event.repository.is_template }}" = "true" ]; then
            echo "::notice title=Template repository::Placeholders are in place, as they should be here. ruff and pytest are deferred."
          else
            echo "::warning title=Bootstrap did not run::This repository still has its template placeholders, so it is not usable yet. See the job summary for the one command that fixes it."
            {
              echo "## Bootstrap did not run"
              echo ""
              echo "This repository still contains \`src/project_name/\` and unresolved"
              echo "placeholder tokens, so the project name was never applied."
              echo ""
              echo "### Fix it in one command"
              echo ""
              echo '```bash'
              echo "git clone https://github.com/${{ github.repository }}.git"
              echo "cd ${{ github.event.repository.name }}"
              echo "python3 bootstrap.py"
              echo "git add -A && git commit -m 'chore: bootstrap project from template' && git push"
              echo '```'
              echo ""
              echo "Running it locally always works. The automatic path can fail when the"
              echo "\`GITHUB_TOKEN\` is not allowed to push -- most often because the"
              echo "repository owner enforces read-only workflow permissions."
              echo ""
              echo "### Or retry the automatic path"
              echo ""
              echo "1. Check **Settings → Actions → General → Workflow permissions** is"
              echo "   set to **Read and write permissions**."
              echo "2. Open the **Actions** tab, pick **Bootstrap template**, hit **Run workflow**."
              echo ""
              echo "Checks are deferred until bootstrapping completes, so this run is green."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          required = [
              "README.md",
              "setup.py",
              "requirements.txt",
              "requirements-dev.txt",
              "src/project_name/__init__.py",
          ]
          missing = [name for name in required if not Path(name).exists()]
          if missing:
              sys.exit("missing template files: " + ", ".join(missing))

          yaml_files = sorted(Path(".").glob("*.yaml")) + sorted(Path("config").glob("*.yaml"))
          for path in yaml_files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"parsed {path}")

          for path in sorted(Path("notebooks").glob("*.ipynb")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"parsed {path}")

          print("Template scaffolding looks intact.")
          PY

      - name: Install the project
        if: steps.template.outputs.bare == 'false'
        run: |
          if [ -f setup.py ]; then
            pip install -e . --no-deps
          else
            echo "No setup.py -- skipping the editable install."
          fi

      - name: Lint with ruff
        if: steps.template.outputs.bare == 'false'
        # The rule set is selected explicitly rather than left to ruff's built-in
        # default, which has widened between releases -- an unpinned `pip install
        # ruff` would otherwise be able to turn a freshly generated repository red
        # without a line of its code changing. Widen it here (and in the pull
        # request checklist) whenever you want stricter linting, or add a
        # ruff.toml to share one rule set between CI and local runs.
        run: ruff check --output-format=github --select E4,E7,E9,F .

      - name: Run tests
        if: steps.template.outputs.bare == 'false'
        run: |
          # The package directory is discovered at run time rather than written in
          # as a placeholder. That is deliberate and load-bearing: GITHUB_TOKEN is
          # forbidden from pushing any change under .github/workflows/, so if
          # bootstrap.py had to rewrite this file, its commit would be rejected with
          # "refusing to allow a GitHub App to ... without `workflows` permission".
          # Keeping this file free of placeholders is what lets bootstrapping run
          # unattended. Do not reintroduce {{...}} tokens anywhere in this directory.
          cov_args=""
          pkg=$(find src -mindepth 1 -maxdepth 1 -type d ! -name '*.egg-info' 2>/dev/null | head -1)
          if [ -n "$pkg" ]; then
            cov_args="--cov=$pkg --cov-report=term-missing"
          elif [ -d src ]; then
            cov_args="--cov=src --cov-report=term-missing"
          fi

          set +e
          pytest -q $cov_args
          status=$?
          set -e

          # Exit code 5 means pytest collected no tests at all, which is the
          # expected state of a brand-new project. Treat it as a pass; the first
          # real test under tests/ flips this back into a genuine check.
          if [ "$status" -eq 5 ]; then
            echo "::notice title=No tests yet::pytest collected no tests. Add some under tests/ to turn this step into a real check."
            exit 0
          fi
          exit "$status"
