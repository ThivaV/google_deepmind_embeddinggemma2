name: Bootstrap template

# Runs once, on the first push to a repository generated from this template.
# It fills in every placeholder from the repository name, renames the package
# directory, then commits the result and deletes both itself and bootstrap.py.
#
# It deliberately does nothing while the repository is still flagged as a
# template, so the placeholders survive in the template itself.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      flavor:
        description: Structure to keep
        type: choice
        default: master
        options: [master, minimal, general, kaggle, cookbook]

permissions:
  contents: write
  # Needed for the final step, which disables this workflow through the API.
  # It cannot delete its own file: GITHUB_TOKEN is refused any push that touches
  # .github/workflows/, and no permission exists that would grant it.
  actions: write

jobs:
  bootstrap:
    # Skip on the template repository itself -- only generated repos get rewritten.
    if: github.event.repository.is_template == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check whether bootstrapping is still needed
        id: check
        run: |
          if [ -f bootstrap.py ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap.py is gone -- this repository was already bootstrapped."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: '3.11'

      - name: Fill in the placeholders
        if: steps.check.outputs.needed == 'true'
        env:
          # vars.TEMPLATE_FLAVOR lets a repo pick a flavour without editing this file.
          FLAVOR: ${{ inputs.flavor || vars.TEMPLATE_FLAVOR || 'master' }}
          DESCRIPTION: ${{ github.event.repository.description }}
        run: |
          python bootstrap.py \
            --flavor "$FLAVOR" \
            --repo "${{ github.repository }}" \
            --author "${{ github.repository_owner }}" \
            --email "${{ github.repository_owner }}@users.noreply.github.com" \
            ${DESCRIPTION:+--description "$DESCRIPTION"}

      - name: Commit the bootstrapped project
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed -- skipping the commit."
            exit 0
          fi
          git commit -m "chore: bootstrap project from template

          Placeholders resolved from the repository name. This commit also removes
          bootstrap.py, which has done its job. The bootstrap workflow itself is
          left in place and disabled through the API, because GITHUB_TOKEN is not
          allowed to push changes under .github/workflows/."
          git push origin HEAD:${{ github.ref_name }}

      # Deleting this file would make the push above illegal, so retire the workflow
      # through the API instead. The job is already a no-op once bootstrap.py is gone;
      # disabling it just stops it showing up as a run on every future push.
      - name: Retire this workflow
        if: steps.check.outputs.needed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bootstrap.yml/disable"; then
            echo "Bootstrap workflow disabled. You can delete .github/workflows/bootstrap.yml whenever you like."
            echo "### Bootstrap complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Placeholders resolved and \`bootstrap.py\` removed. This workflow has disabled itself; delete \`.github/workflows/bootstrap.yml\` at your convenience." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Could not disable the bootstrap workflow::Bootstrapping succeeded. This workflow is already inert (it exits early once bootstrap.py is gone), but you may want to delete .github/workflows/bootstrap.yml yourself."
          fi

      # Whatever went wrong, do not leave the user to work it out from a raw git error.
      # The usual cause is a GITHUB_TOKEN that may not push: an organisation enforcing
      # read-only workflow permissions caps what the permissions: block above can ask
      # for, and no workflow can raise it back.
      - name: Explain a failed bootstrap
        if: failure()
        run: |
          echo "::error title=Bootstrap failed::The project name was not applied. See the job summary for how to finish it by hand."
          {
            echo "## Bootstrap failed"
            echo ""
            echo "The placeholders were resolved but the commit could not be pushed, so"
            echo "this repository is still on the raw template."
            echo ""
            echo "### Finish it locally -- this always works"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd ${{ github.event.repository.name }}"
            echo "python3 bootstrap.py"
            echo "git add -A && git commit -m 'chore: bootstrap project from template' && git push"
            echo '```'
            echo ""
            echo "### Why the automatic path can fail"
            echo ""
            echo "- **Read-only workflow permissions.** Check **Settings → Actions → General**."
            echo "  If this repository belongs to an organisation, the org may enforce read-only"
            echo "  and the setting will be greyed out -- in that case use the local command above."
            echo "- **A protected default branch.** A required review or status check will refuse"
            echo "  a direct push from Actions."
            echo ""
            echo "Once fixed, re-run via **Actions → Bootstrap template → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
